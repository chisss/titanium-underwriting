# Spring Boot Configuration
spring:
  # Application name for service identification
  application:
    name: titanium-underwriting-service
  
  # Database configuration
  datasource:
    url: jdbc:mysql://localhost:3306/titanium_underwriting?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA/Hibernate configuration
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none  # 强制关闭,交由 liquibase 管理
    show-sql: false      # Show SQL statements in logs
    # 注: Hibernate 7 已移除 MySQL5InnoDBDialect，方言由 JDBC 连接自动探测，无需显式指定

  # Liquibase 数据库版本管理
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml
  
  # Kafka configuration for event sourcing
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # ⚠️ 本段不被 Spring 消费：本域依赖裸 spring-kafka（非 spring-boot-starter-kafka），
      #    KafkaProperties 所在的 spring-boot-kafka 自动配置模块不在类路径，Boot 的 Kafka 自动配置不激活，
      #    此处的 serializer 一律不生效（value-serializer 写的 JsonSerializer 更与实际不符）。
      #    生产者参数的唯一事实来源是 infrastructure 的 KafkaConfig#producerFactory
      #    （已显式置 StringSerializer / acks=all / enable.idempotence / retries）。
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: underwriting-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.titanium.underwriting.event  # Trusted packages for JSON deserialization
  
  # OpenFeign configuration for service-to-service communication
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000  # Connection timeout in milliseconds
            readTimeout: 5000     # Read timeout in milliseconds
            loggerLevel: basic    # Feign logging level

# Server configuration
server:
  port: 8083  # HTTP port for the application

# Axon Framework configuration for CQRS and event sourcing
axon:
  serializer:
    general: jackson
  eventhandling:
    processors:
      # CQRS 读侧投影处理组（与写侧隔离）；开启 DLQ 保障读模型投影最终一致。
      # 注: 原 underwritingEvents 处理组引用了不存在的 kafkaMessageSource bean（无 axon-kafka 扩展），
      # 且无对应 @ProcessingGroup，属死配置已删除；写侧用本地 JPA 事件存储。
      underwriting-query-group:
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 10
      # 跨域外发处理组：核保决策事件推送 Kafka（异步回流 policy）
      # 🔴 tracking + DLQ（m6-909）：原为 subscribing——事件到达即同步发布、不经事件存储，看似更简单，
      #    但只有流式处理器（tracking/pooled-streaming）才支持 SequencedDeadLetterQueue，
      #    subscribing 拿不到 DLQ，发布失败即永久丢失（核保结论不回传，投保单永远停在待核保）。
      #    首启位点由顶层 titanium.axon.outbound-relay.groups 登记为事件流末端，避免重放全量历史核保事件。
      underwriting-kafka-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
        batchSize: 1
  commandhandling:
    pool-size: 10  # Number of threads for command handling

# 跨域出站中继：声明哪些处理组按「事件存储即 Outbox」形态装配为 tracking + DLQ，
# 并令其首启位点取事件流末端（避免首次部署重放全量历史核保事件）。
titanium:
  axon:
    outbound-relay:
      groups: [underwriting-kafka-group]

# Logging configuration
logging:
  level:
    com.titanium.underwriting: INFO  # Application logging level
    org.axonframework: INFO          # Axon Framework logging level
    org.springframework.kafka: INFO  # Spring Kafka logging level
    org.hibernate.SQL: DEBUG         # Hibernate SQL logging level

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
